name: G-SENTINEL AGENT RUNNER - APEX SHORT

on:
  # 1. Ejecución programada 24x5 (Cada 15 min, Lunes a Viernes)
  schedule:
    - cron: '*/15 * * * 1-5'

  # 2. Ejecución manual desde la interfaz de GitHub
  workflow_dispatch:

  # 3. Activación remota por Webhook / API (Ping de respaldo Uptime Guard)
  repository_dispatch:
    types: [trigger_sentinel]

permissions:
  contents: write

jobs:
  execute-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install yfinance pandas numpy; fi

      - name: Ejecutar Bot APEX SHORT
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_SECRET_KEY: ${{ secrets.EXCHANGE_SECRET_KEY }}
        run: |
          if [ -f main.py ]; then python main.py; else python fetch_apex_short.py; fi

      - name: Commit y Push de Estado JSON
        run: |
          git config --global user.name "G-SENTINEL-BOT"
          git config --global user.email "bot@g-sentinel.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: Pata 2 APEX SHORT auto-sync [skip ci]" && git push)
