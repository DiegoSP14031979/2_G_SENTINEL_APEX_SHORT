name: G-SENTINEL AGENT RUNNER - APEX SHORT

on:
  schedule:
    # Ejecución automática redundante cada 15 minutos (Lunes a Viernes)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
    # Permite la ejecución manual desde la pestaña Actions
  repository_dispatch:
    # Escucha las peticiones webhook de cron-job.org
    types: [trigger_sentinel, cronjob_trigger]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  execute-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy beautifulsoup4 lxml requests curl_cffi

      - name: Ejecutar Bot G-SENTINEL APEX SHORT
        run: |
          if [ -f main.py ]; then
            python main.py
          else
            python fetch_apex_short.py
          fi

      - name: Sincronización y Commit de Estado JSON (Skip CI)
        run: |
          git config --global user.name "G-SENTINEL-BOT"
          git config --global user.email "bot@g-sentinel.local"
          git add posiciones_short.json historial_short.json || true
          if git diff --staged --quiet; then
            echo "No hay cambios detectados en las posiciones."
          else
            git commit -m "update: Pata 2 APEX SHORT auto-sync [skip ci]"
            git push origin main
          fi
