name: G-SENTINEL PATA 4 // NEXUS SHORT ENGINE AUTO-SYNC

on:
  schedule:
    # Cronjob activo cada hora sin interrupción
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

permissions:
  contents: write

jobs:
  run-nexus-short-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Ejecutar Motor Cuantitativo Short Crypto
        run: python fetch_nexus_short.py

      - name: Commit y Auto-Sync de Posiciones e Historial JSON
        run: |
          git config --global user.name "G-SENTINEL-BOT"
          git config --global user.email "bot@g-sentinel.local"
          git add posiciones.json historial.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: Pata 4 NEXUS SHORT auto-sync [skip ci]" && git push)
